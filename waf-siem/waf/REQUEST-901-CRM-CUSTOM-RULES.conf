# Reglas propias del Equipo Azul para los flujos de Secure CRM.
# Se cargan despues de REQUEST-900 (exclusiones) y antes del CRS.
# Cada regla se limita a una ruta, metodo y entrada concretos.
# ModSecurity en DetectionOnly registra; en On responde 403.

# CRM-01: PoC-02, SQLi en el usuario del login.
SecRule REQUEST_FILENAME "@streq /api/auth/login" \
    "id:10020,phase:2,deny,status:403,log,auditlog,chain,msg:'CRM SQLi en login',tag:'crm/blue/sqli-login'"
    SecRule REQUEST_METHOD "@streq POST" "chain"
    SecRule ARGS:json.username "@rx (?i)'[[:space:]]*(?:or\b|--)" "t:none"

# CRM-02: SQLi en q, entrada que la API concatena en la consulta de tickets.
SecRule REQUEST_FILENAME "@streq /api/tickets" \
    "id:10021,phase:2,deny,status:403,log,auditlog,chain,msg:'CRM SQLi en busqueda de tickets',tag:'crm/blue/sqli-tickets'"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule ARGS_GET:q "@rx (?i)'[[:space:]]*(?:or\b|--)" "t:none"

# CRM-03: etiqueta HTML ejecutable en el parametro de busqueda q.
SecRule REQUEST_FILENAME "@streq /api/tickets" \
    "id:10022,phase:2,deny,status:403,log,auditlog,chain,msg:'CRM XSS en busqueda de tickets',tag:'crm/blue/xss-tickets'"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule ARGS_GET:q "@rx (?i)<[[:space:]]*(?:script|svg|img)\b" "t:none"

# CRM-04: parche virtual acotado para GET /api/users/:id, que expone
# passwordHash y no tiene consumidor en la interfaz actual del CRM.
# No sustituye la correccion de la respuesta en la API.
SecRule REQUEST_FILENAME "@rx ^/api/users/[0-9]+$" \
    "id:10023,phase:1,deny,status:403,log,auditlog,chain,msg:'CRM detalle de usuario sensible',tag:'crm/blue/user-detail'"
    SecRule REQUEST_METHOD "@streq GET" "t:none"
